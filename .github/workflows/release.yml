name: Release layers

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: Which layer flavors to build
        type: choice
        options: [base, extensions, both]
        default: both
      publish:
        description: Publish to AWS (uncheck for a build-only dry run)
        type: boolean
        default: true
      regions:
        description: 'Space-separated regions (empty = all commercial regions)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        env:
          FLAVORS: ${{ inputs.flavors }}
        run: node scripts/matrix.mjs

  build:
    name: ${{ matrix.layer }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build layer
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: scripts/build_layer.sh ${{ matrix.architecture }}

      - name: Smoke test
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: scripts/smoke_test.sh ${{ matrix.architecture }}

      - uses: actions/upload-artifact@v4
        with:
          name: layer-${{ matrix.flavor }}-${{ matrix.architecture }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.layer }}
    needs: [prepare, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    # One job per layer: each assumes the role on its own, so a session cannot
    # expire half way through the matrix, and a region that refuses the upload
    # costs one layer rather than the tail of everything.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: layer-${{ matrix.flavor }}-${{ matrix.architecture }}
          path: release

      - name: Assume the publishing role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to every region
        env:
          FLAVOR: ${{ matrix.flavor }}
          REGIONS: ${{ inputs.regions }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: scripts/publish_layer.sh ${{ matrix.architecture }}

      # always(): a partial publish is still worth recording, and the script
      # writes its state file on the way out even when it fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arns-${{ matrix.flavor }}-${{ matrix.architecture }}
          path: arns/*.json
          if-no-files-found: ignore
          retention-days: 7

  record:
    name: Record published ARNs
    needs: [publish]
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Merges onto the ARNs already committed, so a layer that failed this run
      # keeps the ARNs it had rather than disappearing from the tables.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: arns-*
          merge-multiple: true
          path: arns

      - name: Regenerate the ARN tables
        run: node scripts/update_readme_arns.mjs

      - name: Commit the published ARNs
        run: |
          git add README.md arns
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: publish DuckDB v$(node -p "require('./layer.config.json').duckdbVersion") layers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
