name: Check for a new Node Neo release

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - id: check
        run: node scripts/check_upstream.mjs --write

      - name: Open a bump pull request
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
          DUCKDB_VERSION: ${{ steps.check.outputs.duckdb_version }}
        run: |
          branch="chore/node-api-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists, nothing to do"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -am "chore: bump @duckdb/node-api to $LATEST"
          git push -u origin "$branch"
          gh pr create \
            --title "chore: bump @duckdb/node-api to $LATEST" \
            --body "\`@duckdb/node-api\` went from \`$CURRENT\` to \`$LATEST\` (DuckDB v$DUCKDB_VERSION).

          CI builds and smoke-tests both architectures on this branch. Merge it, then run the **Release layers** workflow to publish."
