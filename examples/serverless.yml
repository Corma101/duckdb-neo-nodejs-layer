# Serverless Framework example. The important part is keeping
# @duckdb/node-api out of the bundle so the layer's copy is used at runtime.
service: duckdb-neo-example

provider:
  name: aws
  runtime: nodejs22.x
  architecture: x86_64
  region: eu-west-1
  memorySize: 2048
  timeout: 30

build:
  esbuild:
    external:
      - '@duckdb/node-api'
      - '@duckdb/node-bindings'
    # The bindings are a native .node file plus a 70 MB shared library; they can
    # never be bundled, only excluded.
    exclude:
      - '@duckdb/*'

functions:
  query:
    handler: examples/handler.handler
    layers:
      # Replace <REGION> and <VERSION> with a row from the README's ARN tables.
      - arn:aws:lambda:<REGION>:<ACCOUNT_ID>:layer:duckdb-neo-nodejs-x86:<VERSION>
    iamRoleStatements:
      - Effect: Allow
        Action: [s3:GetObject, s3:ListBucket]
        Resource:
          - arn:aws:s3:::my-bucket
          - arn:aws:s3:::my-bucket/*
